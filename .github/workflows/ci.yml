name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: ./Scripts/build-app.sh release
      - name: Verify bundle
        run: |
          plutil -lint .build/ModelBar.app/Contents/Info.plist
          codesign --verify --deep --strict .build/ModelBar.app
